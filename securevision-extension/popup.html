<!DOCTYPE html>
<html>
<head>
  <title>SecureVision Extension</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    body {
      width: 400px;
      font-family: sans-serif;
      background-color: #f0f2f5;
    }
    #header {
      background-color: #fff;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #search-bar {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .app-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 10px;
    }
    .app-card {
      background-color: #fff;
      border-radius: 5px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: box-shadow 0.3s ease;
    }
    .app-card:hover {
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .app-icon {
      font-size: 30px;
      margin-bottom: 10px;
    }
    .app-name {
      font-weight: bold;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.4);
    }
    .modal-content {
      background-color: #fefefe;
      margin: 15% auto;
      padding: 20px;
      border: 1px solid #888;
      width: 80%;
    }
    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
    }
    .close:hover,
    .close:focus {
      color: black;
      text-decoration: none;
      cursor: pointer;
    }
    #view-all-data-container {
      margin: 10px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div id="header">
    <input type="text" id="search-bar" placeholder="Search for an app...">
  </div>
  <div class="app-grid" id="app-grid">
  </div>

  <div id="manageModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2 id="modal-title">Manage Credentials</h2>
      <form id="credentials-form">
        <div>
          <label for="admin-user">Admin User:</label>
          <input type="text" id="admin-user" name="admin-user" required disabled>
        </div>
        <div>
          <label for="username">Username/Email:</label>
          <input type="text" id="username" name="username" required>
        </div>
        <div>
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" required>
          <button type="button" id="show-password-btn">Show</button>
        </div>
        <button type="submit">Save</button>
        <button type="button" id="delete-btn">Delete</button>
      </form>
    </div>
  </div>

  <button id="view-all-data-btn">View All Data</button>
  <button id="delete-all-data-btn">Delete All Data</button>
  <div id="all-data-container"></div>

  <script src="popup.js"></script>
</body>
</html>

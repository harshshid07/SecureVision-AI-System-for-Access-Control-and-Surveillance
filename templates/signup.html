{% extends "base.html" %}

{% block title %}Sign Up - SecureVision{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h2 class="card-title text-center mb-4">
                        <i class="bi bi-person-plus-fill text-primary"></i> Create Account
                    </h2>

                    <form id="signupForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="confirmPassword" required>
                        </div>

                        <div class="card bg-light mb-3">
                            <div class="card-body">
                                <h6 class="card-title">
                                    <i class="bi bi-camera-video"></i> Face Registration
                                </h6>
                                <p class="card-text small text-muted">
                                    Position your face in the camera and click "Capture Face"
                                </p>
                                <video id="video" width="100%" height="300" autoplay class="border rounded mb-2"></video>
                                <canvas id="canvas" style="display: none;"></canvas>
                                <button type="button" class="btn btn-primary w-100" id="captureBtn">
                                    <i class="bi bi-camera"></i> Capture Face
                                </button>
                                <div id="faceStatus" class="mt-2"></div>
                            </div>
                        </div>

                        <div id="alertMessage"></div>

                        <button type="submit" class="btn btn-primary w-100 btn-lg" id="submitBtn">
                            <i class="bi bi-person-check"></i> Sign Up
                        </button>
                    </form>

                    <p class="text-center mt-3 mb-0">
                        Already have an account? <a href="{{ url_for('login') }}">Login here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/signup.js') }}"></script>
{% endblock %}
